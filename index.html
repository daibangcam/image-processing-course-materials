<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giáo cụ: Bản chất của Video - HUIT Robotics</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: #eef2f5; 
            color: #333;
            padding: 20px; 
            margin: 0;
        }
        h2 { color: #0056b3; }
        .canvas-container { margin: 20px auto; }
        #main-screen { 
            background: #111; 
            border-radius: 8px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.3); 
            max-width: 100%;
        }
        .controls { 
            margin: 20px auto; 
            padding: 20px; 
            background: white; 
            display: inline-block; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        button { 
            padding: 10px 20px; 
            margin: 5px; 
            cursor: pointer; 
            border: none; 
            border-radius: 6px; 
            background: #0056b3; 
            color: white; 
            font-weight: bold; 
            transition: 0.2s;
        }
        button:hover { background: #003d82; }
        button.btn-alt { background: #28a745; }
        button.btn-alt:hover { background: #1e7e34; }
        
        #filmstrip { 
            display: none; 
            justify-content: center; 
            gap: 15px; 
            margin-top: 20px; 
            flex-wrap: wrap; 
        }
        .frame-box { 
            background: white; 
            padding: 8px; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.2); 
            border: 2px solid #ddd;
        }
        .frame-box canvas { background: #111; width: 150px; height: 100px; border-radius: 4px;}
        .frame-label { font-size: 14px; margin-top: 8px; font-weight: bold; color: #555;}
        
        .slider-container { margin-bottom: 15px; }
        input[type=range] { width: 250px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>🎥 Bản chất của Video: Chuỗi ảnh tĩnh & Tốc độ khung hình (FPS)</h2>
    <p>Kéo thanh trượt FPS xuống mức 2-5 để thấy rõ từng khung hình (frame) bị bắt dính thế nào nhé!</p>

    <div class="canvas-container">
        <canvas id="main-screen" width="750" height="300"></canvas>
    </div>

    <div id="filmstrip"></div>

    <div class="controls">
        <div class="slider-container">
            <label><strong>Tốc độ khung hình (FPS): <span id="fps-val" style="color: #e63946; font-size: 1.2em;">30</span></strong></label><br>
            <input type="range" id="fps-slider" min="1" max="60" value="30">
        </div>
        <button id="btn-play">⏸ Tạm dừng</button>
        <button id="btn-view" class="btn-alt">🎞 Tách thành Cuộn phim</button>
    </div>

    <script>
        const canvas = document.getElementById('main-screen');
        const ctx = canvas.getContext('2d');
        const filmstrip = document.getElementById('filmstrip');
        
        let isPlaying = true;
        let fps = 30;
        let isFilmstripView = false;
        let lastTime = 0;
        let framesHistory = []; // Lưu tọa độ 5 frame gần nhất

        // Vật thể chuyển động (Quả bóng)
        let ball = { x: 50, y: 150, radius: 25, dx: 8, color: '#00d2ff' };

        // Hàm vẽ 1 khung hình tĩnh
        function drawFrame(x) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Vẽ đường kẻ giả làm vạch kẻ đường
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 4;
            ctx.setLineDash([15, 15]);
            ctx.beginPath();
            ctx.moveTo(0, 150);
            ctx.lineTo(canvas.width, 150);
            ctx.stroke();
            ctx.setLineDash([]); // reset

            // Vẽ quả bóng
            ctx.beginPath();
            ctx.arc(x, 150, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = ball.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = ball.color;
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0; // reset
        }

        // Tính toán vật lý
        function update() {
            if (!isPlaying) return;
            ball.x += ball.dx;
            // Đập tường dội lại
            if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                ball.dx *= -1; 
            }
        }

        // Vòng lặp Video
        function loop(timestamp) {
            if (!isFilmstripView) {
                // Kiểm soát tốc độ render dựa trên FPS
                if (timestamp - lastTime >= 1000 / fps) {
                    update();
                    drawFrame(ball.x);
                    lastTime = timestamp;

                    // Lưu lịch sử để làm cuộn phim
                    framesHistory.push(ball.x);
                    if (framesHistory.length > 5) {
                        framesHistory.shift(); // Chỉ giữ 5 frame gần nhất
                    }
                }
            }
            requestAnimationFrame(loop);
        }

        // Hàm render ra 5 khung hình tĩnh
        function renderFilmstrip() {
            filmstrip.innerHTML = ''; 
            framesHistory.forEach((xPos, index) => {
                const box = document.createElement('div');
                box.className = 'frame-box';
                
                const miniCanvas = document.createElement('canvas');
                miniCanvas.width = 150;
                miniCanvas.height = 100;
                const mCtx = miniCanvas.getContext('2d');

                // Scale tỷ lệ xuống cho canvas nhỏ
                mCtx.scale(150/750, 100/300);
                
                // Tô nền
                mCtx.fillStyle = '#111';
                mCtx.fillRect(0, 0, 750, 300);
                
                // Vẽ y chang hàm drawFrame
                mCtx.strokeStyle = '#444'; mCtx.lineWidth = 4; mCtx.setLineDash([15, 15]);
                mCtx.beginPath(); mCtx.moveTo(0, 150); mCtx.lineTo(750, 150); mCtx.stroke(); mCtx.setLineDash([]);
                mCtx.beginPath(); mCtx.arc(xPos, 150, ball.radius, 0, Math.PI * 2);
                mCtx.fillStyle = ball.color; mCtx.fill(); mCtx.closePath();

                const label = document.createElement('div');
                label.className = 'frame-label';
                // Đặt tên frame (từ t-4 đến t)
                label.innerText = `Khung hình [ t - ${4 - index} ]`;

                box.appendChild(miniCanvas);
                box.appendChild(label);
                filmstrip.appendChild(box);
            });
        }

        // Bắt sự kiện người dùng
        document.getElementById('fps-slider').addEventListener('input', (e) => {
            fps = e.target.value;
            document.getElementById('fps-val').innerText = fps;
        });

        document.getElementById('btn-play').addEventListener('click', (e) => {
            isPlaying = !isPlaying;
            e.target.innerText = isPlaying ? "⏸ Tạm dừng" : "▶ Phát tiếp";
        });

        document.getElementById('btn-view').addEventListener('click', (e) => {
            isFilmstripView = !isFilmstripView;
            if (isFilmstripView) {
                canvas.style.display = 'none';
                filmstrip.style.display = 'flex';
                e.target.innerText = "📺 Trở lại xem Video";
                e.target.classList.remove("btn-alt");
                renderFilmstrip();
            } else {
                canvas.style.display = 'block';
                filmstrip.style.display = 'none';
                e.target.innerText = "🎞 Tách thành Cuộn phim";
                e.target.classList.add("btn-alt");
            }
        });

        // Khởi động
        requestAnimationFrame(loop);
    </script>
</body>
</html>
